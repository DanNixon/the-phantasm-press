[package]
name = "the-phantasm-press-controller"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.5.60", features = ["cargo", "derive", "env", "string"] }
env_logger = "0.11.9"
escpos = { version = "0.17.0", features = ["serial_port"] }
getset = "0.1.6"
git-version = "0.3.9"
hex = { version = "0.4.3", features = ["serde"] }
kameo = "0.19.2"
kameo_actors = "0.4.0"
log = "0.4.29"
miette = { version = "7.6.0", features = ["fancy"] }
nusb = { version = "0.2.3", features = ["tokio"] }
postcard = { version = "1.1.3", features = ["use-std"], default-features = false }
protocol = { path = "../protocol" }
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
smart-leds = "0.4.0"
textwrap = "0.16.2"
tokio = { version = "1.50.0", features = ["rt-multi-thread", "macros", "signal"] }
toml = "1.0.3"
words-count = "0.1.6"

[lints.rust]
unused_crate_dependencies = "deny"
