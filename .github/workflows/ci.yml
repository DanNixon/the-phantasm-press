---
name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-slim

    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v21

      - name: Format
        run: nix develop --command treefmt --fail-on-change

  components:
    name: Components
    runs-on: ubuntu-latest
    needs:
      - formatting

    strategy:
      matrix:
        component:
          - controller
          - firmware

    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v21

      - name: Clippy
        run: |
          cd ./${{ matrix.component }}
          nix develop --command cargo clippy -- -Dwarnings

      - name: Build
        run: |
          cd ./${{ matrix.component }}
          nix develop --command cargo build --release

  cad:
    name: CAD
    runs-on: ubuntu-slim
    needs:
      - formatting

    strategy:
      matrix:
        directory:
          - board
          - card-box
          - printer-box

    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v21

      - name: Render CAD files
        run: |
          cd ./cad/${{ matrix.directory }}
          nix develop --command just
