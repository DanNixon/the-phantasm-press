[[card]]
id = "4a94667a"
kind = "Object"
title = "The Chronometer of Lost Hours"
description = "A intricately crafted pocket watch that, when activated, steals the current hour from the user, adding it to a rapidly growing, unseen void."

[[card]]
id = "9b5ec5fa"
kind = "Object"
title = "The Ever-Changing Compass"
description = "A compass whose needle doesn't point North, but rather to the user's deepest unspoken desire, or sometimes, their greatest fear."

[[card]]
id = "2eeada06"
kind = "Object"
title = "The Dream-Etched Quill"
description = "A writing instrument that, when used, pulls imagery and emotions directly from the user's subconscious, making their writings unnervingly vivid or disturbing."

[[card]]
id = "f533286c"
kind = "Object"
title = "The Bottle of Captured Echoes"
description = "A simple glass bottle that, when opened, releases the sound of the last significant event it witnessed, sometimes from centuries past."

[[card]]
id = "db89defa"
kind = "Object"
title = "The Shard of Cosmic Memory"
description = "A small, smoothly polished stone that, when held, grants glimpses into the primordial memories of the universe itself."

[[card]]
id = "853df450"
kind = "Object"
title = "The Cloak of Shifting Identity"
description = "A seemingly plain garment that, when worn, makes others perceive the wearer as an entirely different person, based on their deepest expectations."

[[card]]
id = "b5b6cd5c"
kind = "Object"
title = "The Tome of Unwritten Ends"
description = "An ancient, leather-bound book with blank pages that, when opened, briefly shows the potential final chapter of the reader's current journey."

[[card]]
id = "e3f8df2d"
kind = "Object"
title = "The Seed of a Star Tree"
description = "A singular, ornate seed that, when planted, grows into a living tree whose branches reach into space and bear fruit resembling miniature galaxies."

[[card]]
id = "b57069ac"
kind = "Object"
title = "The Mirror of Fractured Truths"
description = "A beautifully ornate mirror that doesn't show a perfect reflection, but rather distortions that reveal hidden motives or alternate realities."

[[card]]
id = "0b6538b2"
kind = "Object"
title = "The Harmonic Lockbox"
description = "A small, unadorned metal box that can only be opened by humming or playing a specific, unremembered melody."

[[card]]
id = "4f89af0e"
kind = "Object"
title = "The Glimmering Orb of Recall"
description = "A fist-sized, crystalline sphere that, when activated, projects the user's most cherished or forgotten memory as a holographic image."

[[card]]
id = "d3add52d"
kind = "Object"
title = "The Ring of Silent Wishes"
description = "A simple band that grants wishes, but only if they are entirely unspoken and truly from the heart, often with unintended interpretations."

[[card]]
id = "55a20c5b"
kind = "Object"
title = "The Mechanical Heart of the City"
description = "A complex, steam-powered or arcane device hidden deep beneath a city, its steady beat literally maintaining the city's existence."

[[card]]
id = "4a97c87a"
kind = "Object"
title = "The Digital Twin"
description = "A small, sleek device that creates a digital avatar of the user, which can interact with the digital world independently, but also shares sensations and experiences with the user."

[[card]]
id = "4b965d71"
kind = "Object"
title = "The Echoing Siren's Shell"
description = "A conch shell that, when held to the ear, broadcasts the thoughts and emotions of anyone within a mile radius."

[[card]]
id = "031fea2d"
kind = "Object"
title = "The Orb of Static Fate"
description = "A smooth, black orb that, once touched, shows the user an unalterable moment from their predetermined future."

[[card]]
id = "3ab5e67a"
kind = "Object"
title = "The Infinite Spool of Thread"
description = "A seemingly ordinary spool of thread that never runs out, capable of mending anything, or weaving realities."

[[card]]
id = "2536145c"
kind = "Object"
title = "The Key of Universal Language"
description = "A shimmering, metallic key that unlocks not just doors, but the ability to understand and speak any language, living or dead."

[[card]]
id = "35a23a14"
kind = "Object"
title = "The Broken Timepiece"
description = "A beautiful but shattered clock whose hands sometimes move backward or skip forward, causing localized temporal anomalies."

[[card]]
id = "bba627f6"
kind = "Object"
title = "The Feather of Cosmic Flight"
description = "A single, iridescent feather that, when grasped, can lift the holder into the air and carry them across vast distances, even beyond atmosphere."

[[card]]
id = "4a2bd87a"
kind = "Object"
title = "The Chalice of Truth Serum"
description = "A simple, yet elegant goblet that, when filled with any liquid, transforms it into a potion that compels absolute honesty."

[[card]]
id = "514f96d4"
kind = "Object"
title = "The Scroll of Imperfect Invisibility"
description = "An ancient scroll upon which a spell for invisibility is written, but it only works if no one is directly observing the user at the moment of activation."

[[card]]
id = "6b45b471"
kind = "Object"
title = "The Box of Paradoxical Gifts"
description = "A small, unassuming wooden box that, when opened, contains a desired item, but the item's presence retrospectively creates a logical contradiction."

[[card]]
id = "f1ec82d4"
kind = "Object"
title = "The Whispering Crystal"
description = "A peculiar stone found in an ancient ruin that seems to breathe softly and occasionally shares fragmented narratives of bygone eras."

[[card]]
id = "c5c94c50"
kind = "Object"
title = "The Lost Secrets"
description = "A tome that contains key, significant knowledge that was thought to have been lost."

[[card]]
id = "2b59dbfa"
kind = "Object"
title = "The Key"
description = "A small, unassuming key that holds the power to unlock something of great importance, whether it be a physical door, a hidden truth, or a metaphorical barrier."
